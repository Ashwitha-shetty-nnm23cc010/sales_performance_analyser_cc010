<!DOCTYPE html>
<html>
<head>
    <title>Add Sale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .add-sale-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #333333;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="add-sale-container">
        <h2>Add Sale Record</h2>
        <form method="post">
            <input type="text" name="product_name" placeholder="Product Name" required><br>
            <input type="number" name="quantity" placeholder="Quantity" required><br>
            <input type="number" name="price" placeholder="Price" required step="0.01"><br>
            <input type="text" name="region" placeholder="Region" required><br>
            <input type="text" name="salesperson" placeholder="Salesperson" required><br>
            <input type="date" name="sale_date" required><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
