<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Feedback Form</h2>
        <!-- Replace the src URL with your Google Form embed link -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfBUEPpHeM9UzuIrzBINfSgkrJTIr-eWQDeubBTE9kCfEij3A/viewform?usp=sharing"></iframe>
    </div>
</body>
</html>
