<!DOCTYPE html>
<html>
<head>
    <title>Region-Wise Sales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #cccccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .actions {
            margin-bottom: 20px;
        }
        .actions a {
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            padding: 10px 15px;
            border-radius: 4px;
            margin-right: 10px;
        }
        .actions a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Region-Wise Sales</h2>
    <div class="actions">
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <table>
        <thead>
            <tr>
                <th>Region</th>
                <th>Total Sales</th>
            </tr>
        </thead>
        <tbody>
            {% for region in region_sales %}
            <tr>
                <td>{{ region['region'] }}</td>
                <td>{{ region['total_sales'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
