<!DOCTYPE html>
<html>
<head>
    <title>Manage Regions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333333;
        }
        .form-container {
            margin-bottom: 20px;
        }
        .form-container form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-container input, .form-container button {
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-container button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #cccccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h2>Manage Regions</h2>
    <div class="form-container">
        <form method="POST">
            <input type="text" name="name" placeholder="Region Name" required>
            <button type="submit">Add Region</button>
        </form>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            {% for region in regions %}
            <tr>
                <td>{{ region['id'] }}</td>
                <td>{{ region['name'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
