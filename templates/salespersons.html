<!DOCTYPE html>
<html>
<head>
    <title>Manage Salespersons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333333;
        }
        .form-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Four equal columns */
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-container input, .form-container button {
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-container button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #cccccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h2>Manage Salespersons</h2>
    <div class="form-container">
       <form action="/salespersons" method="POST">
    <input type="text" name="name" placeholder="Salesperson Name" required>
    <input type="email" name="email" placeholder="Email">
    <input type="text" name="phone" placeholder="Phone">
    <button type="submit">Add Salesperson</button>
</form>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody>
            {% for salesperson in salespersons %}
            <tr>
                <td>{{ salesperson['id'] }}</td>
                <td>{{ salesperson['name'] }}</td>
                <td>{{ salesperson['email'] }}</td>
                <td>{{ salesperson['phone'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
